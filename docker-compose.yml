version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_grupo3_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_grupo3
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_grupo3"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
